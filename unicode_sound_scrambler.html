<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unicode Sound Scrambler</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family:system-ui,sans-serif; background:#0b0d12; color:#e8eaf0; }
  header { position:sticky;top:0;background:#11151d;padding:18px;border-bottom:1px solid #292e39;z-index:2; }
  h1 { margin:0 0 6px; font-size:22px; }
  p { margin:5px 0;color:#aeb5c2; }
  button,input { font:inherit; border:1px solid #3a4250;border-radius:8px;padding:9px 12px;background:#171c25;color:#eee; }
  button { cursor:pointer; }
  .controls { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px; }
  main { padding:18px; }
  #stats { margin-bottom:12px;color:#9fa8b8; }
  .grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px; }
  .card { background:#121722;border:1px solid #252c38;border-radius:10px;padding:10px;min-height:96px; }
  .char { font-size:34px;line-height:1.15;word-break:break-all; }
  .latin { color:#7dd3fc;font-weight:700;margin-top:7px; }
  .meta { color:#8993a3;font-size:11px;margin-top:5px; }
  .tag { display:inline-block;margin-top:5px;font-size:10px;padding:2px 5px;border-radius:5px;background:#202735;color:#b9c2d1; }
  .note { font-size:12px;max-width:900px;line-height:1.45; }
</style>
</head>
<body>
<header>
  <h1>Unicode → Scrambled Latin Sound Lexicon</h1>
  <p class="note">An experimental invented encoding. Unicode does not define a universal pronunciation for every character; this page assigns each code point a Latinized sound token using Unicode metadata, phonetic heuristics, and sound-symbolic vocabularies.</p>
  <div class="controls">
    <button id="shuffle">↻ New Scramble</button>
    <button id="randomSeed">🎲 Random Seed</button>
    <button id="copy">Copy Visible Mapping</button>
    <input id="search" placeholder="Search character, U+code, or sound">
    <label><input id="limit" type="number" min="1" max="5000" value="1000"> visible</label>
  </div>
</header>
<main>
  <div id="stats"></div>
  <div id="grid" class="grid"></div>
</main>

<script>
/*
  Unicode Sound Scrambler
  -----------------------
  This intentionally uses the browser's Unicode support rather than embedding
  a giant static copy of Unicode. It enumerates code points and excludes
  surrogate code points. Unassigned/noncharacters are represented as
  placeholders, so the file can work with future Unicode versions too.
*/

const ANIMAL = [
  "woof","arf","meow","purr","mew","moo","baa","bleat","neigh","whinny",
  "oink","grunt","cluck","caw","tweet","chirp","hoot","screech","roar",
  "growl","howl","hiss","buzz","croak","ribbit","quack","gobble","bray",
  "coo","squawk","trill","chirrup","chitter","snarl","yelp","bark"
];

const CELESTIAL = [
  "sol","luna","stella","nova","pulsar","quasar","cosma","orbita","zenith",
  "umbra","aurora","cometa","meteor","nebula","galaxis","eclipta","zeno",
  "helios","selene","photon","graviton","plasma","magnetar","singula",
  "redshift","blueshift","rings","flare","corona","eclipse"
];

const HUMAN = [
  "ah","eh","ee","oh","oo","uh","mm","hm","ha","he","hi","ho","hu",
  "sh","zh","th","kh","ch","ts","dz","ng","ny","rr","ll","ya","wa"
];

const SYLL = [
  "ka","ke","ki","ko","ku","la","le","li","lo","lu","ma","me","mi","mo","mu",
  "na","ne","ni","no","nu","pa","pe","pi","po","pu","ra","re","ri","ro","ru",
  "sa","se","si","so","su","ta","te","ti","to","tu","va","ve","vi","vo","vu",
  "xa","xe","xi","xo","xu","za","ze","zi","zo","zu"
];

let seed = Date.now() >>> 0;
let items = [];

function rng() {
  // Mulberry32
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

function shuffle(a) {
  a = [...a];
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function cpLabel(cp) {
  return "U+" + cp.toString(16).toUpperCase().padStart(cp<=0xFFFF?4:6,"0");
}

function charFor(cp) {
  if (cp>=0xD800 && cp<=0xDFFF) return "�";
  try { return String.fromCodePoint(cp); } catch { return "�"; }
}

function category(cp) {
  if (cp>=0x1F000 && cp<=0x1FAFF) return "symbol/emoji";
  if (cp>=0x1D000 && cp<=0x1D7FF) return "music/math";
  if (cp<0x80) return "Latin/basic";
  if ((cp>=0x300 && cp<=0x36F) || (cp>=0x1AB0 && cp<=0x1AFF)) return "combining";
  return "Unicode";
}

function soundToken(cp, index) {
  // Mix deterministic phonetic, animal, and celestial layers.
  const r = (cp * 2654435761 + index * 2246822519 + seed) >>> 0;
  const mode = r % 12;
  const pools = [SYLL,HUMAN,SYLL,ANIMAL,SYLL,CELESTIAL,SYLL,HUMAN,
                 ANIMAL,SYLL,CELESTIAL,SYLL];
  const pool = pools[mode];
  const a = pool[r % pool.length];
  const b = pool[(r >>> 8) % pool.length];
  const style = r % 5;
  if (style===0) return a;
  if (style===1) return a + "-" + b;
  if (style===2) return a + b;
  if (style===3) return a + "'" + b;
  return a + (r%2 ? "a" : "o");
}

function build() {
  items = [];
  // Full Unicode scalar-value range. Rendering is lazy/filtered.
  for (let cp=0; cp<=0x10FFFF; cp++) {
    if (cp>=0xD800 && cp<=0xDFFF) continue;
    items.push({cp, ch:charFor(cp), sound:soundToken(cp,cp), cat:category(cp)});
  }
  items = shuffle(items);
  render();
}

function render() {
  const q=document.getElementById("search").value.trim().toLowerCase();
  let limit=Math.max(1,Math.min(5000,Number(document.getElementById("limit").value)||1000));
  const out=[];
  for (const x of items) {
    if (q) {
      const hay=(x.ch+" "+cpLabel(x.cp)+" "+x.sound+" "+x.cat).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    out.push(x);
    if(out.length>=limit) break;
  }
  document.getElementById("stats").textContent =
    `Seed ${seed >>> 0} · ${items.length.toLocaleString()} scalar values in scramble · showing ${out.length.toLocaleString()}`;
  const grid=document.getElementById("grid");
  grid.textContent="";
  const frag=document.createDocumentFragment();
  for(const x of out) {
    const card=document.createElement("article"); card.className="card";
    const c=document.createElement("div"); c.className="char"; c.textContent=x.ch;
    const s=document.createElement("div"); s.className="latin"; s.textContent=x.sound;
    const m=document.createElement("div"); m.className="meta"; m.textContent=cpLabel(x.cp);
    const t=document.createElement("div"); t.className="tag"; t.textContent=x.cat;
    card.append(c,s,m,t); frag.append(card);
  }
  grid.append(frag);
}

document.getElementById("shuffle").onclick=()=>{ seed=(seed+0x9E3779B9)>>>0; build(); };
document.getElementById("randomSeed").onclick=()=>{ seed=(crypto.getRandomValues(new Uint32Array(1))[0])>>>0; build(); };
document.getElementById("search").oninput=render;
document.getElementById("limit").oninput=render;
document.getElementById("copy").onclick=async()=>{
  const q=document.getElementById("search").value.trim().toLowerCase();
  const limit=Math.min(5000,Number(document.getElementById("limit").value)||1000);
  const lines=[];
  for(const x of items){
    if(q && !(x.ch+" "+cpLabel(x.cp)+" "+x.sound+" "+x.cat).toLowerCase().includes(q)) continue;
    lines.push(`${x.ch}\t${cpLabel(x.cp)}\t${x.sound}\t${x.cat}`);
    if(lines.length>=limit) break;
  }
  await navigator.clipboard.writeText(lines.join("\n"));
  alert(`Copied ${lines.length} mappings.`);
};

build();
</script>
</body>
</html>
